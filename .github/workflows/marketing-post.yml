# Posts Supa's Instagram calendar on time from the "marketing" branch of the private repo (every 10 min;
# public repo, so no minute quota). Replaces post.yml, which used supa-2.0 (now disabled, kept).
# Commits only marketing/ files, and only to the "marketing" branch. Honors marketing/PAUSE.
name: marketing-post
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
concurrency:
  group: post
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: furkanecavus-afk/supa
          ref: marketing
          ssh-key: ${{ secrets.SUPA_DEPLOY_KEY }}
      - name: Guard and pause
        id: gate
        run: |
          CI=1 sh marketing/guard/guard.sh check
          if [ -f marketing/PAUSE ]; then echo "PAUSE: nothing posted"; echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.go == '1'
        run: pip install -q -r tools/mkt/requirements.txt
      - name: Post what's due
        if: steps.gate.outputs.go == '1'
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_IG_USER_ID: "17841411113780211"
          IG_GRACE_MIN: "0"
        run: python -m tools.mkt.ig due
      - name: Save the calendar status (marketing branch only)
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name "supa-scheduler"
          git config user.email "supa-autopilot@users.noreply.github.com"
          git add marketing/content-calendar.csv marketing/changelog.md
          CI=1 sh marketing/guard/guard.sh commit
          git diff --cached --quiet || (git commit -qm "scheduler: instagram post" && git pull -q --rebase origin marketing && git push -q origin HEAD:refs/heads/marketing)
